name: Release

# Этот workflow запускается при push в main и выполняет:
# 1. semantic-release - создает версию, обновляет CHANGELOG, создает тег
# 2. После создания тега автоматически запустится build-release.yml
# 3. build-release.yml соберет бинарники и создаст GitHub Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Сначала проверяем что все тесты и линтеры прошли
  check:
    name: Run checks before release
    uses: ./.github/workflows/check-all.yml

  release:
    name: Create release version
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "semantic-release-bot"
          GIT_AUTHOR_EMAIL: "semantic-release-bot@martynus.net"
          GIT_COMMITTER_NAME: "semantic-release-bot"
          GIT_COMMITTER_EMAIL: "semantic-release-bot@martynus.net"
        run: npx semantic-release